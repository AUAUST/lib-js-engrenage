entries:
  - id: 261123-376a
    subject: init step for `.ai/discarded.md`
    need: create the log with the project
    reason: agents create it on first entry, no tooling needed
  - id: 261123-76e1
    subject: structure nested walker
    need: walker reading the nested declaration child by child (#322)
    reason: rewrites the walker and resolvers for no behavior change; flattening at the boundary keeps them
  - id: 261123-f7f8
    subject: structure flat declarations
    need: keeping `namespaces` and `domains` beside `structure` (#322)
    reason: two shapes for one concept and a merge check between them
  - id: 261123-1cf9
    subject: lazy declaration declarer
    need: recursive option declarations in `foundation/options` (#322)
    reason: one consumer; kept private in `declareStructureNodes`
  - id: 261123-fef2
    subject: optional structure wrapper
    need: "`structure` optional without child records accepting `undefined` (#322)"
    reason: no declarer wraps an object declaration with its own optionality; debt marker instead
  - id: 261123-0801
    subject: layout plugin text edits
    need: assignments kept beside `=` (#418)
    reason: joining `=⏎` cannot break the `rhs` again; printer override instead
  - id: 261123-4dbb
    subject: "`operator-linebreak`"
    need: assignments kept beside `=` (#418)
    reason: no working fix, fights Prettier
  - id: 261123-17e2
    subject: "`dprint-plugin-typescript`"
    need: assignments kept beside `=` (#418)
    reason: formatter swap, no assignment option found
  - id: 261123-0bfb
    subject: Prettier fork
    need: assignments kept beside `=` (#418)
    reason: maintenance cost; printer override instead
  - id: 261123-55a3
    subject: no-unnecessary-type-parameters
    need: skip reports on functions without a return annotation
    reason: silences single-use parameters the inferred return never uses; the rule now reads the checker's return type instead
  - id: 261123-b05f
    subject: declareSection `Config` removal
    need: silence its single-use report
    reason: "a `config: Resolver` parameter makes `ConfigResolver` annotations circular and loses the default for unannotated sections"
  - id: 261123-94b8
    subject: reusable checks workflow
    need: share the jobs between ci.yml and publish.yml
    reason: sync only updates existing workflow files, so consumers would never receive a new one
  - id: 261123-d57f
    subject: build.outDir artifact path
    need: pass only the build output to the release job
    reason: unreadable before engrenage is installed, which breaks init; the whole built tree is uploaded instead
  - id: 261123-738e
    subject: tests sharding as the fix for slow tests
    need: CI under 2 minutes
    reason: hides the engrenage test suite's own slowness, which toolkit's 2k tests in under 1 minute show; sharding kept only as a config option
  - id: 261123-63b3
    subject: side-effect import of sub-domain extensions
    need: keep their `declare global` in dist declarations
    reason: duplicates the value import, fails `auaust/no-duplicates`, and every parent must remember it
  - id: 261123-6318
    subject: named-match-values export style
    need: helper types beside helpers (#433)
    reason: type axis could not be constrained anywhere
  - id: 261123-f551
    subject: "`@barrel <glob> <mode>` as built-in directive"
    need: barrels in marker blocks
    reason: restates role files and export contracts the structure holds
  - id: 261123-eebf
    subject: per-consumer barrel generators (#435 only)
    need: barrels
    reason: every project re-implements rendering and export modes
  - id: 261123-7898
    subject: automd
    need: directive blocks with custom generators
    reason: Markdown only, no structure context
  - id: 261123-0278
    subject: markdown-magic
    need: comment-block transforms
    reason: Markdown-centred, own option parser; engrenage's parser is 74 lines
  - id: 261123-91f6
    subject: barrelsby
    need: barrel generation
    reason: derives from globs, duplicating the resolved structure
  - id: 261123-1852
    subject: ctix
    need: barrel generation
    reason: derives from the tsconfig, duplicating the resolved structure
  - id: 261123-4ca7
    subject: source-tree sync products
    need: one-pass sync with generated sources (#436)
    reason: every config key would declare its file dependencies; generate stage instead
  - id: 261123-2d42
    subject: classify role-holding directories as domains
    need: entry-only domains (#430)
    reason: a misplaced role directory silently becomes a domain; namespace option instead
  - id: 261123-6a3f
    subject: config key reset registry
    need: hide `forget` from every LoadedConfig holder but project/sync
    reason: needs module-level state shared by createProjectConfig and a second export, beyond the issue
  - id: 261123-8c7a
    subject: eslint cache
    need: speed up repo-wide lint with `--cache`
    reason: type-aware and cross-file structure rules make cached results stale; dropped for good
  - id: 261123-b0f3
    subject: fixed fragment layout `<root>/data/metalbrain/<kind>`
    need: list an extension's agent fragments
    reason: its references must resolve through the package's exports, so the `./metalbrain/<kind>/*.md` export is the authoritative location
  - id: 261123-dab2
    subject: hand-rolled semver range matching
    need: extension `compatibility` check
    reason: "`semver` is already installed through typescript-eslint"
  - id: 261123-0e23
    subject: "`gh-issue-sync`"
    need: local issue drafts published with placeholder ids (#323)
    reason: Go binary, one repository, no issue types, org fields or sub-issues, creates missing labels
  - id: 261123-79dd
    subject: "`git-bug`"
    need: offline issue drafting with a GitHub bridge (#323)
    reason: issues in git objects, no Markdown files, types or fields
  - id: 261123-6937
    subject: "`gh-md`, `kup`, `issync`"
    need: Markdown issue sync (#323)
    reason: title, body and labels only; no types, org fields or sub-issues
  - id: 261123-4bc9
    subject: spawning `gh` from the publisher
    need: publish drafts (#323)
    reason: "keeps the shell quoting behind the hook friction; Octokit decided in #316"
  - id: 261123-7542
    subject: denying agents direct issue writes
    need: steer agents to the publisher (#323)
    reason: the user keeps GitHub open to agents
  - id: 261123-b4c4
    subject: per-repository GitHub snapshot files
    need: cross-repository metadata (#323)
    reason: org types and fields repeated in each file
  - id: 261123-df29
    subject: hand-kept AUAUST repository list or whole-org listing
    need: repository registry (#323)
    reason: a list to maintain, or short names guessed from naming conventions
  - id: 261123-f062
    subject: "`structure --check` reporting role companions"
    need: missing companion files (#455)
    reason: reads no file contents, would report lint's finding twice; lint preferred by the user
  - id: 261123-547c
    subject: "`// @barrel guards` block in toolkit's `guard` entry"
    need: one entry collecting a role from every domain (#454)
    reason: an entry-only domain's entry is a whole generated file, blocks cannot sit in it
  - id: 261123-76d0
    subject: toolkit `barrels.exports` contribution for the `guard` entry
    need: one entry collecting a role from every domain (#454)
    reason: re-derives the structure in toolkit, and lands after toolkit#203, whose names would drop meanwhile
  - id: 261123-81ea
    subject: ids in the planning sheet
    need: direct GitHub calls without reading the snapshot (#207)
    reason: every agent would load them; the snapshot holds them
  - id: 261123-926c
    subject: publish re-rendering an unclaimed Plan's Roadmap
    need: segment members expanded when only the segment changes (#207)
    reason: writes an issue without its claim; the set must include the Plan instead
  - id: 261123-5a7d
    subject: walk check
    need: computing the issue-walking handling-table row (#452)
    reason: restates the skill's table in code; findings carry their rule instead
  - id: 261123-3e84
    subject: "`parent` and `after` on child drafts"
    need: sub-issue order (#323)
    reason: "order scattered across children; parents' `subIssues` decided in #207"
  - id: 261123-4be0
    subject: "`tools/github/drafts` sub-domain only"
    need: placement of the planner code (#207)
    reason: leaves the mixed domain to a later split; layered `tools/github/issues` namespace chosen
  - id: 261123-edc5
    subject: "@octokit/plugin-paginate-graphql"
    need: paginate issue-tree connections (#452)
    reason: new bundled dependency for one cursor loop; local loop as in the snapshot fetch
  - id: 261123-de95
    subject: lazy git imports in issue operations
    need: keep config loading free of git setup
    reason: the schema moved to its owner instead, removing the barrel edge
  - id: 261123-b284
    subject: PostToolUse format hook
    need: agent-written files formatted on write (#472)
    reason: Bash writes give no paths, and the stop and commit gates already format every changed file
  - id: 261123-b3e4
    subject: Prettier on staged blobs
    need: format partially staged files in the gate (#472)
    reason: refusing them matches the agent gate; checking the index content needs a stdin pipeline per file
  - id: 261123-9263
    subject: "`github-label-sync`"
    need: label sync with rename aliases (#320)
    reason: "#320 derives labels from the structure and Octokit is already bundled; reuse its alias model"
  - id: 261123-024c
    subject: structure tree row builders
    need: separate node-to-row builder per output over a shared drawing helper
    reason: labels would stay in two places
  - id: 261123-1a3c
    subject: namespace role shadow
    need: "`subpath` at the environment root only (#483)"
    reason: re-declares every option of the global role and drifts once it changes
  - id: 261123-3adb
    subject: namespace role shadow
    need: toolkit's modules without a types barrel
    reason: re-declares the global role and drifts (#483); index "root" instead (#493)
  - id: 261123-c8cc
    subject: unused role barrel in toolkit protocol
    need: drop the types shadow as is
    reason: "contradicts toolkit #186, a module's entry is its only barrel"
  - id: 261123-536b
    subject: calling a role callback on a placeholder module for its map description
    need: "`companions` shown in maps"
    reason: callbacks compute on real names (`name.slice(2)`), a placeholder yields garbage
  - id: 261123-8f9f
    subject: bare callback or `{ resolve, description }` union for `file` and `companions`
    need: lighter declaration
    reason: "a bare callback leaves its map cell empty, the gap #485 fixed"
  - id: 261123-766a
    subject: gate skipping `.ai/issues/` formatting
    need: stop false body conflicts at publish (#500)
    reason: editors and hooks still format drafts; normalizing the merge covers every formatter
  - id: 261123-6718
    subject: context-share freshness threshold (#516)
    need: consultant replacement
    reason: a window share means different sizes per model; twice the starting context instead
  - id: 261123-9c05
    subject: widened walker review (#516)
    need: cross-leaf review
    reason: fills the context the consultant keeps small
  - id: 261123-123b
    subject: code-review skill as merger (#516)
    need: cross-leaf review reuse
    reason: no view of sibling leaves, no rebase, no Codex equivalent
  - id: 261123-9b08
    subject: one consultant-merger agent (#516)
    need: fewer agents
    reason: one judges against the plan, the other against the code
  - id: 261123-3bfb
    subject: shared draft manifest field reader (#511)
    need: "`checkDrafts` `readBlockers` and `listPublishedFieldValues` `readFieldValue` both read manifest field values"
    reason: one Blockers read, outside the leaf's scope
  - id: 261123-05e0
    subject: Blockers-only issue fetch (#512)
    need: "`releaseIssues` needs one field but `fetchIssue` sends five requests"
    reason: a second fetcher for one command run by hand, outside the leaf's scope
  - id: 261123-3bc0
    subject: option on `engrenage jscpd` (#518)
    need: new clones of a range by name
    reason: the command forwards every argument to jscpd, so an engrenage option collides with its flags
  - id: 261123-0a82
    subject: gate range scope (#518)
    need: new clones of a range by name
    reason: reaches every gate step for one jscpd use
  - id: 261123-7902
    subject: jscpd --ignore-identifiers (#518)
    need: twin helpers across concurrent leaves
    reason: "no new clone on #499 and #500's range at project thresholds, import-line noise below them"
  - id: 261123-e19f
    subject: jscpd --dead-code (#516)
    need: exports a range leaves unused, for the merger
    reason: resolves no `#` alias, so lists every aliased module as unused
  - id: 261123-5563
    subject: concurrency as a split reason (#505)
    need: more segment members
    reason: each leaf adds a dispatch, merger and review round small items never repay
  - id: 261123-dca6
    subject: blockedBy between segment members
    need: finer concurrency than segment order
    reason: the walker stops on any open blocked-by; reshaping or sequencing covers it
  - id: 261123-99c9
    subject: boundary-only merger at K > 1 (#522)
    need: fewer agents per leaf
    reason: leaves rebases and conflicts to the walker or the workers
  - id: 261123-c858
    subject: merger fixing every finding (#522)
    need: no worker resume
    reason: it would review its own non-mechanical fixes; the review run still sees mechanical ones
  - id: 261123-89b4
    subject: prettier-plugin-jsdoc
    need: canonical JSDoc layout without deciding tag order
    reason: sorts tags and rewrites content beyond this pass; targeted eslint-plugin-jsdoc rules instead.
  - id: 261123-dc6b
    subject: prettier-plugin-jsdoc
    need: balanced JSDoc wrapping
    reason: its "balance" style only keeps existing breaks, and it rewrites descriptions as Markdown
  - id: 261123-80ec
    subject: hint lint level beside info
    need: advisory messages for agents only
    reason: differs from info by audience alone; info messages reach agents instead (#526)
  - id: 261123-5d54
    subject: comment scanner in foundation/jsdoc
    need: locating JSDoc blocks in source
    reason: every consumer already runs a parser listing comments
  - id: 261123-251a
    subject: extension-owned doc tags (`owns.tags`)
    need: declaring JSDoc tags
    reason: presets in one adjustable list let projects override, extend and order them
  - id: 261123-2b24
    subject: "`@throws {@link Type}`"
    need: canonical throws form
    reason: TypeScript 6.0.3 does not rename through it, only through `@throws {Type}`
  - id: 261123-9063
    subject: jsdoc/informative-docs
    need: comments restating their name
    reason: leaves with eslint-plugin-jsdoc; judging added value stays with review
  - id: 261123-827c
    subject: inlining readDocumentedSignature/readOverload into docTags
    need: single-consumer helpers
    reason: "exceeds the file-line limit, and #368 needs the block lookup"
  - id: 261123-cc4e
    subject: balanced JSDoc wrapping
    need: no orphan last line
    reason: equal-length lines narrow long paragraphs far below the width
  - id: 261123-9820
    subject: hybrid JSDoc wrapping
    need: balance two-line paragraphs, pretty beyond
    reason: arbitrary line-count threshold
  - id: 261123-0429
    subject: planning sheet skill
    need: load the sheet only for issue-writing agents
    reason: skill invocation is model-driven and can be skipped; a `paths`-scoped rule on drafts loads deterministically
  - id: 261123-512a
    subject: "`TagDeclaration` documents flag"
    need: override whether a tag counts for `auaust/documented`
    reason: the body kind already decides it; no project needs another answer yet
  - id: 261123-1fe2
    subject: lint rule optimisation, merging or removal
    need: faster lint
    reason: rule logic is ≤ 15% of a full lint and < 20 ms per file; config load, program builds and the checker dominate
  - id: 261123-8435
    subject: prettier import sorting plugin
    need: move `auaust/sort-imports` load off ESLint
    reason: saves ~5 ms per file, adds a Prettier parse
  - id: 261123-cae5
    subject: reimplementing delegated rules
    need: delegation overhead
    reason: "`resolveDelegate` adds none at runtime"
  - id: 261123-3de6
    subject: "`@biomejs/biome`"
    need: validation stack switch
    reason: own CST rule API without JS fixes, far fewer type-aware rules, no formatter plugins; every convention rewritten
  - id: 261123-2abe
    subject: "`rslint`"
    need: validation stack switch
    reason: younger 0.x fork of the tsgolint engine Oxlint maintains
  - id: 261123-7d78
    subject: "`tsslint`"
    need: cache-friendly type-aware lint
    reason: runs as a language service plugin, which TypeScript 7 lacks
  - id: 261123-c010
    subject: Oxlint beside ESLint
    need: faster lint keeping conventions in ESLint
    reason: two hosts, and ESLint keeps its program builds while any convention reads types
  - id: 261123-a924
    subject: typescript-eslint on TypeScript 7.1
    need: faster type-aware lint
    reason: maintainers expect no speed-up from its first IPC client
  - id: 261123-85a5
    subject: rolldown `entriesAware` chunk groups
    need: fewer small library chunks
    reason: merge threshold folds ESLint into CLI registration
  - id: 261123-a133
    subject: rolldown priority `cli` chunk group
    need: keep CLI registration out of merged chunks
    reason: build fails on an ineffective dynamic import
  - id: 261123-305a
    subject: rolldown `experimentalInlineCommonChunks`
    need: inline tiny shared chunks
    reason: "requires `preserveEntrySignatures: false`, which empties library entry exports"
  - id: 261123-8346
    subject: rolldown `codeSplitting.groups` merging shared chunks
    need: fewer files per library import
    reason: default splitting already loads ~14 files per entry; merges add bytes, leak packages and no measurable speed-up
  - id: 261123-8959
    subject: declareObject async entries
    need: await async entry defaults inside the object resolve (src.bundled)
    reason: changes the synchronous Declaration.resolve contract across foundation/options
  - id: 261123-ac14
    subject: tsdown declaration helper-stripping plugin
    need: keep `output.keepNames` with declarations
    reason: rewrites rolldown-plugin-dts output and shifts declaration maps
  - id: 261123-aeee
    subject: rolldown-plugin-dts pnpm patch
    need: drop `__name` from declaration chunks
    reason: fixes only this repository, not consumers of createTsdownConfig
  - id: 261123-707e
    subject: eslint `--concurrency`
    need: faster full lint (#558)
    reason: 34 → 25 s at 2.5–3× memory, each thread rebuilds the same TS programs
  - id: 261123-867b
    subject: "`oxfmt`"
    need: faster JS and TS formatting (#558)
    reason: "no printer plugins, loses #418 layouts; fixed Prettier is ~1–2 s"
  - id: 261123-0516
    subject: tsgolint fork
    need: native-speed typed conventions (#558)
    reason: permanent fork upkeep of a Go rule engine
  - id: 261123-405a
    subject: "`flint`"
    need: hybrid linter with TS rules on a native core (#558)
    reason: experimental
  - id: 261123-ea59
    subject: typescript-eslint `EXPERIMENTAL_backend
    need: "'tsgo'`: ESLint typed rules on TS 7.1 (#558)"
    reason: 1.0–1.7× slower than TS 6 until TS ships bulk APIs
  - id: 261123-9b5c
    subject: ESLint `calculateConfigForFile` as info-rules source
    need: one native config load in the lint hook
    reason: returns merged settings, losing which config object last set each rule to `info`
  - id: 261123-5613
    subject: "@auaust/codegen"
    need: barrels and block writers outside engrenage
    reason: never published, repository idle since 2026-09 (#51 closed)
  - id: 261123-12d3
    subject: SessionStart identity hook
    need: wrong-location check (#462)
    reason: agents already know their directory; another hook able to lock agents out (#598)
  - id: 261123-7018
    subject: Bash hook shell-trap warnings
    need: zsh friction (#597)
    reason: a hook on every Bash call; hooks lock agents out (#598)
  - id: 261123-595a
    subject: walk state file
    need: walker state surviving compaction
    reason: "`walk check` and the walk's commits already hold it"
  - id: 261123-8a39
    subject: integration merger at K = 1 in interactive walks
    need: walker context
    reason: a merger run per leaf while the user can steer; autonomous only
  - id: 261123-6e36
    subject: dispatch during a segment's review run
    need: concurrency at segment boundaries
    reason: the review fix may change what later work builds on
  - id: 261123-704e
    subject: picomatch
    need: dot-aware block syntax matching
    reason: needs separate `@types/picomatch`; `minimatch`, the engine behind `node:path` `matchesGlob`, ships types and keeps its semantics
  - id: 261123-26b9
    subject: environment role list config key
    need: one load of default role presets
    reason: a new config key contract; a context-memoized `readEnvironmentRoles` operation suffices
  - id: 261123-5c17
    subject: sync include filler
    need: inline the issues rule into each drafting skill
    reason: "sync code beyond the writer's role; skills Read the `paths` rule explicitly until #277"
  - id: 261123-350d
    subject: issue-drafting skill
    need: one filing and drafts source for four skills
    reason: no skill-to-skill install dependency, invocation model-driven; a default `paths` rule instead
  - id: 261123-9ddd
    subject: dispatch stop gate via `claude --settings`
    need: headless gated agent stop gate
    reason: caller's engrenage writes a hook the target's engrenage version may not accept; a target `Stop` settings hook instead
  - id: 261123-3cae
    subject: runtime-name map of dispatchers in `agents`
    need: picking a runtime's headless client
    reason: runtimes are contributed data; an optional `dispatcher` on `AgentRuntime` instead
  - id: 261123-4f51
    subject: cross-repository walk rule as generated rule
    need: keep foreign-leaf text out of every walk
    reason: only `paths:` or always-loaded, needs a never-matching glob; skill supporting file instead (#683)
  - id: 261123-3af2
    subject: cross-repository walk rule as shipped extension rule
    need: same need
    reason: init skips extension rules and sync never installs them, pointer could dangle
  - id: 261123-7834
    subject: pkg.pr.new previews
    need: unreleased upstream in downstream PR CI (package split report)
    reason: public registry and GitHub App, republishes a restricted package
  - id: 261123-d5a6
    subject: linked sibling checkouts in CI
    need: unreleased upstream in downstream PR CI (package split report)
    reason: lockfile stops describing what CI tested
  - id: 261123-1cc1
    subject: in-process adapters as the only metalbrain protocol
    need: engrenage integration (package split report)
    reason: peer within one 0.x minor, excludes non-JS stacks
  - id: 261123-7eb8
    subject: GraphQL engine in @auaust/codegen
    need: Interscript GraphQL generation (package split report)
    reason: "@graphql-codegen/cli and gql.tada provide it; schemas are client data"
  - id: 261123-8d75
    subject: rulesync, @intellectronica/ruler, agentsmesh
    need: instruction distribution (package split report)
    reason: copy one source to runtimes, no packs, providers, hooks, gates or planning contract
  - id: 261123-796b
    subject: Claude subagent `skills:` preload
    need: reach supporting files from agent files
    reason: Claude-only; skills with disable-model-invocation cannot be preloaded
  - id: 261123-e062
    subject: "`./metalbrain/shared/*.md` export before any shared file"
    need: let skills share supporting files
    reason: publint fails on an export matching no files; ship it with the first file
  - id: 261123-3ff0
    subject: rolldown 1.3.3 upgrade
    need: drop the leaked internal export from lazily loaded chunks
    reason: its fix (#11737) covers only exports another chunk imports; the dead `t` export stays
  - id: 261123-b637
    subject: rolldown `preserveEntrySignatures
    need: '"strict"`: keep dynamic entry chunk signatures'
    reason: applies to static entries only, no effect on the syncPackageJson chunk
  - id: 261123-63b0
    subject: static `#tools/pnpm/index` import in enableLinkedSource
    need: remove the dynamic barrel entry that leaks `listPnpmWarnings`
    reason: loads built modules before the run defers to linked sources
  - id: 261123-5ed2
    subject: "`pickExport(import(…), name)` loader helper"
    need: name the export a lazy loader loads
    reason: "`extension-imports` forbids its static import in `extension.ts`"
  - id: 261123-0a70
    subject: "`[import(…), name]` loader tuple"
    need: name the export without a helper
    reason: no TypeScript type ties the name to the module; even valid loaders fail to check
  - id: 261123-72a2
    subject: "`import(…).then(({ name }) => name)` loaders"
    need: select the export by name
    reason: config section types inferred from the loaders turn `unknown` (1264 errors)
  - id: 261123-2b3c
    subject: tsconfig project references to `src` (#702)
    need: give compiling environments `src`'s ambient files
    reason: "imports resolve to declaration output, which never carries `.d.ts` inputs; needs composite emit against #68's noEmit references"
  - id: 261123-3819
    subject: shared ambient tsconfig extended by environments (#702)
    need: one list of `src`'s ambient files
    reason: "`include` never merges through `extends`; inherited `files` drops silently under any own `files`; a generated file more"
  - id: 261123-44fb
    subject: ambient detection by missing imports and exports (#702)
    need: identify `src`'s ambient files
    reason: misses `declare global` augmentations, which import; the `declarations` role already names them
  - id: 261123-c642
    subject: hook command workspace root
    need: shell repeating the config lookup's `pnpm-workspace.yaml` globs
    reason: "duplicates #713's lookup in sh; the shell finds the nearest installed engrenage-hook within the repository or workspace, the actions resolve the root from the payload `cwd`"
  - id: 261123-f638
    subject: delete `syncPaths` (#711)
    need: no generated `src` alias needs tsconfig `paths`
    reason: non-`#` bundler aliases (`$shopify/*`) resolve only through `paths`, which `imports` cannot hold
  - id: 261123-035c
    subject: instructions rule removal
    need: retire the rule once the skill holds its rules
    reason: needs sync, init and test changes beyond the writer's role; kept as a pointer stub (agent-instructions backlog)
  - id: 261123-14cd
    subject: ResolvedEnvironment move to batiment
    need: "structural part split out in #734"
    reason: "no batiment consumer before #735's walk takes data; moving now would split a config-key contract twice."
  - id: 261123-cd11
    subject: Structure diagnostics in lint
    need: walk diagnostics reported per file by ESLint
    reason: gate and `batiment map --check` already fail on them; lint would re-report metafile findings it cannot locate in code.
  - id: 261123-4cba
    subject: Sync refusing every error diagnostic
    need: blocking sync on the structure report
    reason: an unclassified directory or cycle would block the sync that fixes it; only kept-value diagnostics block.
  - id: 261123-fed4
    subject: Structure node kind as a field
