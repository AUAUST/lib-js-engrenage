purpose: The filesystem abstraction, globbing and glob anchoring.
entries:
  - id: 261122-5799
    title: Literal paths are globbed as patterns
    sites:
      - src/tools/typescript/extension.ts:74
    why: each barrel path becomes a glob unescaped, so a path such as `[id]` matches other files or none; `escapeGlob` in foundation/filesystem now escapes the git-ignored list
    want: literal paths escaped before globbing.
  - id: 261122-cdb5
    title: Glob helpers return or render more than asked
    sites:
      - src/foundation/filesystem/operations/createFilesystem.ts:185
      - src/foundation/blocks/utils/anchorGlobs.ts:11
    why: "`globFiles` also yields the directories `patterns` match, so `glob` returns them as files; minimatch's `braceExpand` unescapes `\\{`, so an anchored glob for a literal brace renders it unescaped."
    want: files only from `glob`; literal braces kept escaped.
