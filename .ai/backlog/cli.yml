purpose: Command definitions, registration and program runs.
taps:
  - {id: BL-39182b, at: 2026-11-26T17:04:02Z, note: "jscpd:new over the #945 range lists the metalbrain close/show, issue claim/publish/release and codegen editions/schemas actions for it"}
  - {id: BL-26fcd2, at: 2026-11-27T15:20:40Z, note: "after 0ce9d1a2f, codegen rules --check exits 0 with no diff on a clean tree; not checked against a stale output"}
entries:
  - id: BL-62e56b
    title: A failing run resolves the config again
    sites:
      - src/tools/nexus/operations/runEngrenageProgram.ts:10
    why: runEngrenageProgram resolves the config again to read debug once a command fails
    want: The failing command config reused
    done: "Tracked by #1015 (own engine)"
    created: 2026-11-22T00:00:00Z
  - id: BL-39182b
    title: Every action repeats the validated config load
    sites:
      - src/nexus/cli/operations/getRunContext.ts:4
    why: "each bin and scripts action calls `loadValidatedConfig(…, { reporter: getRunContext().reporter })`, cloned across actions (jscpd: `structure`, codegen `editions`, `rules`, `schemas`)."
    want: a run-scoped config loader in the run context.
    created: 2026-11-22T00:00:00Z
  - id: BL-97905e
    title: The abort signal stops a run only where its action checks it
    sites:
      - src/nexus/cli/operations/executeProgram.ts:45
    why: past the check before an action loads, prompts, config loads and writes ignore the abort signal
    want: the signal honoured by prompts, loads and writes
    created: 2026-11-22T00:00:00Z
  - id: BL-dc8e50
    title: Tool runs and linked runs resolve against the wrong base
    sites:
      - src/workflows/cli/operations/runTool.ts:14
      - src/workflows/cli/operations/prepareLinkedRun.ts:95
    why: a glob given from a subdirectory still matches from the root; reading the link record through the pnpm surface loads built pnpm, GitHub and Git modules before the run defers to the checkout's build.
    want: globs resolved from the cwd; the record read without loading built modules.
    created: 2026-11-22T00:00:00Z
  - id: BL-e63aac
    title: The stale-barrel error names the barrel's first line instead of the line listing the missing module
    sites:
      - src/tools/nexus/operations/explainStaleBarrel.ts:47
    why: After moving src/tools/agents/claude/extension.ts, the message for src/workflows/builtins/entry.ts said to delete the projectBuild line
    want: The message quotes the line whose specifier resolves to the missing module
    created: 2026-11-22T00:00:00Z
  - id: BL-ab1893
    title: Bare engrenage is not on PATH in consumers
    why: "Seven interscript entries; the link and devEngines cases are #964, the batiment bin #953"
    created: 2026-11-26T10:59:20Z
  - id: BL-efac74
    title: Split CLIs need engrenage's config, sync and tools, so their split is more than a package switch
    sites:
      - bin/metalbrain/index.ts:1
      - bin/batiment/actions/map.ts:1
    why: "bin/metalbrain imports #workflows/config 32 times, #project/sync 16, #tools/* 17; batiment map needs #workflows/config and #project/structure reportStructure; only the command interface is settled"
    want: A decision on how a split CLI finds its host, or which commands stay in engrenage
    done: "Planning item of #1003, moved from #966"
    created: 2026-11-26T11:19:47Z
  - id: BL-b46a5f
    title: A command defined through another nexus/cli module instance cannot read the run context
    sites:
      - src/nexus/cli/operations/runContext.ts:1
    why: Registration symbols are shared by key, but each module instance holds its own AsyncLocalStorage, so getRunContext from the second instance throws and its abort check is skipped
    want: The run context reachable from every module instance of the entry
    created: 2026-11-26T14:40:01Z
  - id: BL-26fcd2
    title: "`pnpm support codegen <generator> --check` writes files instead of checking"
    sites:
      - scripts/codegen/index.ts:70
    why: 'Through scripts/executable.ts the flag is dropped: exit 0, files rewritten; runDefinition(rules, "--check") honors it'
    want: A subcommand option after its name reaches that subcommand from the real CLI
    created: 2026-11-26T17:23:13Z
  - id: BL-6c9693
    title: nexus/cli exports lack the docs auaust/documented asks for
    sites:
      - src/nexus/cli/index.ts:1
    want: document createProgram, getRunContext, CommandDefinition and the 10 other flagged exports
    created: 2026-11-27T10:22:22Z
  - id: BL-58e88e
    title: Commands still format their own output lines
    why: "moved from #1003 Planning; waits on #1005"
    want: "remaining commands report through #1005 entries, split by bin"
    done: no command formats lines for reporter.log itself
    created: 2026-11-27T12:02:30Z
  - id: BL-d71eff
    title: "The engine's usage errors suggest less than Commander did: no suggestion for a transposed command name or an inline value on a boolean flag"
    sites:
      - src/nexus/cli/utils/suggestName.ts:1
    why: batiment mpa suggested map on Commander, prints none now; map --check=x suggested --check, now only unknown option '--check=x'
    want: Suggestions catching transpositions and a boolean flag given an inline value
    created: 2026-11-27T17:01:18Z
  - id: BL-ecb4e5
    title: Engrenage's executables wrap their run beyond nexus's launch
    sites:
      - bin/engrenage/executable.ts:21
      - bin/metalbrain/executable.ts:27
      - bin/batiment/executable.ts:21
    why: "compile cache, linked checkouts, stale barrels, configured debug and hook failures live in each bin executable, so nexus launch alone cannot run these programs; scripts executables move onto launch in #1029"
    want: each executable only hands its program to launch from nexus/cli
    created: 2026-11-27T19:41:32Z
  - id: BL-bf599d
    title: An invalid project config warns once per failing command loader and layer, repeating the same config error
    sites:
      - src/nexus/cli/operations/executeProgram.ts:73
    why: "engrenage --help warns four times: the extensions and scripts loaders and the sync options and choices layers each load config"
    want: one warning per distinct root cause, naming every source and layer it hides
    created: 2026-11-27T20:40:03Z
  - id: BL-8b4933
    title: A command's own help fails whole when one of its layers fails to load, though the root help lists it apart
    sites:
      - src/nexus/cli/operations/resolveInvocation.ts:40
    why: with an invalid config, engrenage sync --help prints only the config error, while engrenage --help lists sync and warns
    want: a command's help describing every fact that loads, warning for each failing layer
    created: 2026-11-27T20:59:19Z
  - id: BL-743591
    title: Help listing project scripts runs the whole structure discovery for one environment's directories
    sites:
      - src/tools/nexus/operations/scriptsSource.ts:12
    why: engrenage --help spends ~0.25 s of ~0.52 s in structure discovery here
    want: the scripts directories read through a discovery of the one environment, reconciled and activity-checked as full discovery does
    created: 2026-11-28T01:45:05Z
