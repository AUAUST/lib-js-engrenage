purpose: Command definitions, registration and program runs.
taps:
  - {id: BL-9c8fb3, at: 2026-11-25T09:49:58Z, note: Chaining (#910) overrides parseOptions and parses twins under stand-in parents in createCommandDefinition.ts}
  - {id: BL-4e55ba, at: 2026-11-26T12:21:26Z, note: Reframed as command extensions (PD-b6bbc6)}
entries:
  - id: BL-62e56b
    title: Command mounting re-derives state Commander hides
    sites:
      - src/nexus/cli/operations/configureCommand.ts:3
      - src/tools/nexus/operations/runEngrenageProgram.ts:8
    why: Commander exposes no action getter, so mounting wraps action to detect a call; a failing run resolves the config again
    want: No action wrapping to detect a call; the failing command config reused
    created: 2026-11-22T00:00:00Z
  - id: BL-39182b
    title: Every action repeats the validated config load
    sites:
      - src/nexus/cli/operations/getRunContext.ts:4
      - bin/engrenage/actions/vite.ts:5
    why: "each bin and scripts action calls `loadValidatedConfig(…, { reporter: getRunContext().reporter })`, cloned across actions (jscpd: `structure`, codegen `editions`, `rules`, `schemas`); the Vite action repeats `ensureSourceConfigLoader` of `#tools/vitest`."
    want: a run-scoped config loader in the run context; one source config loader.
    created: 2026-11-22T00:00:00Z
  - id: BL-97905e
    title: The run context and abort signal stay optional
    sites:
      - src/nexus/cli/operations/createCommandDefinition.ts:105
      - src/nexus/cli/operations/createCommandDefinition.ts:106
    why: tests run commands outside `runProgram`; past the check, prompts, config loads and writes ignore the abort signal.
    want: the context required through `getRunContext`; the signal honoured by prompts, loads and writes.
    created: 2026-11-22T00:00:00Z
  - id: BL-9c8fb3
    title: Program wiring leans on Commander internals and copies
    sites:
      - src/nexus/cli/operations/createProgram.ts:7
      - src/nexus/cli/utils/toUsageError.ts:5
      - src/nexus/cli/operations/defineCommand.ts:1
    why: "the root definition's `commandExtension` never runs, so tests wrap commands in a group; the `error: ` prefix Commander adds is stripped by text; `defineCommand` and `defineLazyCommand` clone each other (jscpd)."
    want: extensions applied at the root; messages without the prefix; one command definer
    created: 2026-11-22T00:00:00Z
  - id: BL-dc8e50
    title: Tool runs and linked sources resolve against the wrong base
    sites:
      - src/workflows/cli/operations/runTool.ts:14
      - src/workflows/cli/operations/prepareLinkedRun.ts:95
    why: a glob given from a subdirectory still matches from the root; reading the link record through the pnpm surface loads built pnpm, GitHub and Git modules before the run defers to the sources.
    want: globs resolved from the cwd; the record read without loading built modules.
    created: 2026-11-22T00:00:00Z
  - id: BL-e63aac
    title: The stale-barrel error names the barrel's first line instead of the line listing the missing module
    sites:
      - src/tools/nexus/operations/explainStaleBarrel.ts:47
    why: After moving src/tools/agents/claude/extension.ts, the message for src/workflows/builtins/entry.ts said to delete the projectBuild line
    want: The message quotes the line whose specifier resolves to the missing module
    created: 2026-11-22T00:00:00Z
  - id: BL-4e55ba
    title: Programs cannot mount commands from extensions they discover, so consumers run scripts through per-project aliases
    why: A CLI runs on its own, so extensions must be self-discovered; interscript runs pnpm exec tsx scripts/executable.ts shop build
    want: A safe nexus extension pattern (discovery, validation, name-conflict resolution) whose first case runs and lists any command of a project scripts tree through engrenage, with no per-project entry, interpreter or alias
    done: "Item in #966 after #955; settles the scripts shortcut shape"
    created: 2026-11-26T10:59:20Z
  - id: BL-ab1893
    title: Bare engrenage is not on PATH in consumers
    why: "Seven interscript entries; the link and devEngines cases are #964, the batiment bin #953"
    created: 2026-11-26T10:59:20Z
  - id: BL-efac74
    title: Split CLIs need engrenage's config, sync and tools, so their split is more than a package switch
    sites:
      - bin/metalbrain/index.ts:1
      - bin/batiment/actions/map.ts:1
    why: "bin/metalbrain imports #workflows/config 32 times, #project/sync 16, #tools/* 17; batiment map needs #workflows/config and #project/structure reportStructure; only the command interface is settled"
    want: A decision on how a split CLI finds its host, or which commands stay in engrenage
    done: "Settled in #966"
    created: 2026-11-26T11:19:47Z
  - id: BL-101628
    title: Command trees lack a canonical hot path apart from their heavy commands
    why: metalbrain mixes hooks that must start as fast as possible with commands that parse and discover, under one entry; lazy commands cover most of it without a stated pattern
    want: A hot-path group declared inline in the main command, registered as the executable loads and matched before anything else loads; the rest lazy as a whole, one module registering every other command only when the hot path misses
    done: "Item in #966 after #955"
    created: 2026-11-26T12:03:38Z
  - id: BL-4037bb
    title: Commands print one output shape for agents and humans
    why: "Agents need dense output structured for their reading; humans need colored, padded, structured output. Prior art: github.com/sdairs/is-ai-agent for detection"
    want: Different printers for the same command data, picked by detected audience; the rendering itself is a separate concern
    done: "Item in #966 after #955"
    created: 2026-11-26T12:03:38Z
  - id: BL-c7380b
    title: Commands an extension registers after program creation miss the run options
    sites:
      - src/nexus/cli/operations/createProgram.ts:1
      - src/nexus/cli/operations/defineGroup.ts:1
    why: createProgram adds --debug and --verbose to the commands present at creation, so commands mounted later by an extension likely refuse them; likely, not run
    want: Every mounted command takes the run options
    done: "Verified in #966 command extensions"
    created: 2026-11-26T12:03:38Z
  - id: BL-b46a5f
    title: A command defined through another nexus/cli module instance cannot read the run context
    sites:
      - src/nexus/cli/operations/runContext.ts:1
    why: Registration symbols are shared by key, but each module instance holds its own AsyncLocalStorage, so getRunContext from the second instance throws and its abort check is skipped
    want: The run context reachable from every module instance of the entry
    created: 2026-11-26T14:40:01Z
