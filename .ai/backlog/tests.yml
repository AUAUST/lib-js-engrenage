purpose: Test infrastructure and coverage gaps.
entries:
  - id: BL-9a6dd1
    title: Test infrastructure gaps
    sites:
      - src/project/build/operations/createEmittedManifest.ts:25
      - tests/scripts/codegen/generateApiDeclarations.test.src.ts:24
      - tests/setup.ts:15
      - tests/bin/engrenage/batiment/map.test.src.ts:36
      - tests/src/project/config/resolveListOption.test.src.ts:1
      - tests/utils/binaryTimeout.ts:1
    why: 'tsdown and Vite hooks untested, no real build with `clean: "emitted"`; a bare timeout beside `binaryTimeout`; every warning silenced; structure output untested; `foundation/options` tested from `project/config`''s mirror; a comment below `binaryTimeout` explains instead of naming.'
    want: a build-level test; one named timeout scale; an owned logger so tests silence only expected warnings; structure test on its report; options test in its mirror; a name carrying the explanation.
  - id: BL-bb583a
    title: Test setup reaches the package through workarounds
    sites:
      - tests/src/tools/eslint/roleRules.test.ts:42
      - tests/src/tools/eslint/apiInterface.test.src.ts:13
      - tests/tooling/eslint/rules.test.src.ts:21
      - tests/utils/linkSourcePackage.ts:14
      - tests/utils/linkSourcePackage.ts:15
      - tests/src/foundation/blocks/syncBlocks.test.src.ts:5
    why: temporary configs cannot import `@auaust/engrenage` or the tooling, so rules cross through `globalThis`; every root entry is linked; a source-only test exists because generated paths resolved the former `agents/constants` subpath to the index.
    want: test configs resolve package and tooling; the link limited to published and source-mode entries; the block test through the public entry.
  - id: BL-adfd1d
    title: Process-spawning tests time out under concurrent agents' load
    why: "under load, spawn-based tests fail while passing alone: `runGateLocks`, `hookFailures`, `syncVscodeFiles`, `init`, `checkAgents`, `barrelDirective`, `syncDirectiveBlocks`, `codegen/config` and others hit 5000 ms in both gates and `pnpm build`, up to 4 commit attempts beside parallel sessions (friction ×11)."
    want: these tests scale their timeouts with `binaryTimeout`, or the gate runs them without competing load.
  - id: BL-518105
    title: Tests initialize Git repositories by hand
    sites:
      - tests/src/project/environments/environments.test.ts:179
      - tests/src/project/environments/environments.test.ts:203
      - tests/src/project/environments/environments.test.ts:208
      - tests/src/tools/github/syncWorkflowFiles.test.src.ts:133
      - tests/src/tools/prettier/resolvePrettierAllArguments.test.src.ts:60
      - tests/src/tools/vitest/createVitestConfig.test.src.ts:345
      - tests/src/tools/shopify/theme/theme.test.src.ts:101
      - tests/src/tools/github/issues/contract/issueTree.test.src.ts:146
      - tests/src/tools/github/issues/contract/issueContract.test.src.ts:831
      - tests/src/tools/git/hashTree.test.src.ts:38
      - tests/src/tools/git/listExcludeFiles.test.src.ts:11
      - tests/src/tools/git/listIgnoredGlobs.test.src.ts:18
      - tests/src/tools/eslint/createEslintConfig.test.src.ts:1595
    why: nine tests repeat the same `git init` beside `createTemporaryProject`, while `createGitRepository` covers only linked-module repositories.
    want: one test utility, or a `createTemporaryProject` option, creating the repository.
  - id: BL-a8de8a
    title: Test setups clone each other
    sites:
      - tests/src/tools/eslint/boundaries.test.ts:141
      - tests/src/tools/eslint/noComplexConciseArrows.test.ts:11
      - tests/src/tools/typescript/produceTsconfigInclude.test.src.ts:12
    why: temporary projects, ESLint instances and `syncProject` helpers are repeated; jscpd finds 18 test clones, also in `createEslintConfig`, `syncLefthookConfig`, `issueContract`, `issueTree`, `runGateLocalFiles`, `produceTsconfigRuntime` and `enableLinkedSource`/`findSourceExecutable`.
    want: shared builders in `tests/utils`, starting with the marked sites.
  - id: BL-b3c1c5
    title: Tests reloading a project's config get cached state
    why: "friction ×3: between two loads of one root, a rewritten `engrenage.config.ts` stays cached by Node, a deleted file stays in the cached filesystem, aliases stay memoized; agents call `loadConfig.refresh` or edit through `config.context.filesystem`. Related: `BL-73c8d3`, #57."
    want: a test utility that changes a temporary project and returns a freshly loaded config.
  - id: BL-456d16
    title: No test covers a resumed re-split logging once
    sites:
      - tests/src/tools/github/issues/drafts/publish.test.src.ts:809
    why: the interrupted-publish test checked the Re-split log written once on resume through a child addition, which S.1 no longer counts as a re-split.
    want: one case resuming a failed publish of a genuine re-split, expecting a single log line.
  - id: BL-a279d0
    title: Four tests fail on a full local run at main 611110e6
    sites:
      - tests/tooling/eslint/rules.test.src.ts:21
      - tests/src/tools/agents/projectMap.test.ts:1
    why: three tooling role rule tests reject role rules as 'Expected a rule entry'; projectMap 'renders enforced grants for published=true' lacks '| source and dist |'
    done: a full pnpm engrenage vitest passes at main
  - id: BL-0f2376
    title: Five test files each derive the repository root from their own relative URL
    sites:
      - tests/src/tools/eslint/boundaries.test.ts:619
      - tests/src/tools/eslint/conventionImports.test.src.ts:11
      - tests/src/metalbrain/instructions/agentNames.test.src.ts:8
      - tests/src/project/config/lazyLoading.test.src.ts:10
      - tests/src/batiment/structure/entityIndex.test.src.ts:34
    want: One testutil exporting the repository root, reused by each site
