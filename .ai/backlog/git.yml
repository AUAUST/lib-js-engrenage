purpose: "The Git tool domain: repository layout, commit reading and Git-owned ignore globs."
entries:
  - id: 261122-4774
    title: Git reads assume a default repository layout
    sites:
      - src/metalbrain/runtimes/hooks/operations/resolveMainWorktree.ts:43
      - src/tools/git/utils/readCommitMessage.ts:5
    why: the common directory is assumed to sit in the main worktree, false for submodules and separate git directories; comment lines are recognised by `#` though `core.commentChar` picks another.
    want: the main worktree from `git worktree list`; the comment character read from config.
  - id: 261122-a06c
    title: Agent worktree ignores sit in the editor group
    sites:
      - src/tools/git/constants.ts:60
    why: agent worktrees are not editor files.
    want: an agents group, or the agents domain contributing its own ignores.
  - id: 261124-a168
    title: Ignored-file globs list every ignored file, so ESLint and Vitest get thousands of ignore globs
    sites:
      - src/tools/git/operations/listIgnoredGlobs.ts:17
      - src/tools/eslint/operations/createEslintConfig.ts:109
      - src/tools/vitest/operations/createVitestConfig.ts:169
    why: Interscript passes 2154 globs from partly tracked theme/assets and theme/data; their cost inside ESLint (19 s whole project) is unmeasured
    want: measure their share, then collapse the list or pass tools a predicate
