purpose: The `format` section, formatter selection and formatting vocabulary.
entries:
  - id: BL-243e77
    title: Format section scope and reach
    sites:
      - src/project/format/constants.ts:24
      - src/project/format/operations/formatContent.ts:5
      - src/project/sync/operations/formatChanges.ts:24
      - src/foundation/json/types/JsonIndentation.ts:1
      - src/project/format/config/schemas/formatSchema.ts:47
    why: JSON has no tool domain at the conventions boundary, so it ignores `format`; callers pass the formatter though `format.formatter` selects one; synced files use the project's formatter even when the git filesystem sits above the root; `insertSpaces`/`tabSize` duplicate `indent`; complexity limits sit in the formatting section.
    want: formatter selected from config; `format` applied to JSON; one vocabulary; complexity limits in a section on how code is written (planning).
  - id: BL-e6fbf7
    title: Formatter entries validate a `package` no consumer reads
    sites:
      - src/project/format/ports/FormatterEntry.ts:14
    want: its contract stated, or the field removed.
