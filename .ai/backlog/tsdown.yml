purpose: "Generated tsdown build configuration: entries, outputs and declaration files."
entries:
  - id: BL-067b52
    title: Tsdown config and entry self-references are hand-built
    sites:
      - src/tools/tsdown/operations/createTsdownConfig.ts:177
      - src/tools/tsdown/plugins/createEntrySelfReferencesPlugins.ts:12
    why: '`createTsdownConfig` repeats `=== undefined` checks where a "prop if defined" helper fits, its place (`src/utils` or toolkit) a decision; `createEntrySelfReferencesPlugins` rebuilds the specifier from the entry name, which `PathAlias` should carry.'
    want: helper and `PathAlias` specifier.
    created: 2026-11-22T00:00:00Z
  - id: BL-0df503
    title: Declarations stay bundled because rolldown-plugin-dts keeps externalized `import()` types verbatim
    sites:
      - src/tools/tsdown/plugins/createEntrySelfReferencesPlugins.ts:39
    want: "an upstream fix in rolldown-plugin-dts (repository not AUAUST's: stays here, no issue)."
    created: 2026-11-22T00:00:00Z
  - id: BL-7b117f
    title: Build lists are maintained by hand beside their source
    sites:
      - tsdown.config.ts:5
      - src/project/build/setup/createBuildToolStep.ts:4
    why: commander and @clack transitive dependencies are mirrored in `inlinedDependencies`; build tools are not read from `build.tools` contributions.
    want: the bundled dependency closure derived from the package; build tools read from their contributions.
    created: 2026-11-22T00:00:00Z
  - id: BL-9b6e76
    title: Bin declarations are generated, then deleted
    sites:
      - src/tools/tsdown/plugins/createOmittedDeclarationsPlugins.ts:6
    want: tsdown skips bin declarations per entry.
    created: 2026-11-22T00:00:00Z
  - id: BL-349345
    title: Kept names cover only the minifier because rolldown-plugin-dts leaves `__name` in declarations
    sites:
      - src/tools/tsdown/operations/createTsdownConfig.ts:90
    why: '`build.minify: "keepNames"` maps to minifier `keepNames`; `output.keepNames` also covers bundling renames but its `__name` import survives in `.d.mts`, failing `typecheck:dist`.'
    want: "an upstream fix in rolldown-plugin-dts `isHelperImport` (repository not AUAUST's: stays here, no issue), then `output.keepNames`."
    created: 2026-11-22T00:00:00Z
  - id: BL-dc14f1
    title: The emitted manifest plugin is written twice
    sites:
      - src/tools/tsdown/plugins/createEmittedManifestPlugins.ts:16
      - src/tools/vite/plugins/createEmittedManifestPlugin.ts:14
    why: tsdown and Vite get identical rollup-style hooks (jscpd).
    want: one plugin from `project/build`, wrapped by each tool.
    created: 2026-11-22T00:00:00Z
  - id: BL-e3cb01
    title: Internal tags are trimmed from declarations without a parser
    sites:
      - src/tools/tsdown/utils/trimInternalTags.ts:21
    why: template literal types rely on hand-tracked braces.
    want: the declaration emitter or rolldown-plugin-dts exposing the comments it prints (upstream, not AUAUST's).
    created: 2026-11-22T00:00:00Z
  - id: BL-461b06
    title: Declarations keep bare side-effect imports of externals whose types tree-shaking dropped
    sites:
      - src/tools/tsdown/operations/createTsdownConfig.ts:226
    why: consumers load and type-check packages no public type uses; sh-syntax's DOM-only types broke typecheck:dist once an internal index re-exported sh-syntax-typed utils
    want: externals reached only from declarations resolve without module side effects, so unused ones drop from .d.mts output
    created: 2026-11-25T03:34:05Z
