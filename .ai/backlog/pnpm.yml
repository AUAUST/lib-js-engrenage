purpose: pnpm integration and package-manager scripts.
entries:
  - id: BL-fa8a97
    title: Build policies of installed packages are hand-listed in the pnpm domain
    sites:
      - src/tools/pnpm/constants.ts:14
    why: an init step adding a package with an unlisted build script fails the install with `ERR_PNPM_IGNORED_BUILDS`; lefthook did.
    want: "the step or extension adding a package declares its build policy and the pnpm workspace settings collect them (planning: new contract)."
    created: 2026-11-22T00:00:00Z
  - id: BL-6f4769
    title: Variables pnpm sets for binaries are observed, not documented
    sites:
      - src/tools/pnpm/constants.ts:28
    why: listed from pnpm 12 runs, so a pnpm release may change them silently.
    want: a documented source, or a test catching drift.
    created: 2026-11-22T00:00:00Z
  - id: BL-d168b0
    title: The synced prepare script never restores links after pnpm add or pnpm remove, which skip prepare under pnpm 12
    sites:
      - src/tools/pnpm/setup/syncPrepare.ts:1
    why: Its changeset links-survive-installs.md promises links survive installs; only pnpm install runs prepare
    want: Links restored, or the promise narrowed, after every pnpm command replacing them
    created: 2026-11-26T19:53:41Z
