purpose: Generated GitHub workflows and templates.
entries:
  - id: 261122-a6ef
    title: Nested workflows are relocated by string substitution
    sites:
      - src/tools/github/operations/renderWorkflow.ts:9
      - src/tools/github/operations/renderWorkflow.ts:10
    why: regex replacements silently stop matching when a template changes; the lockfile name repeats `tools/pnpm`'s resource.
    want: templated YAML; the lockfile location read from its owner.
  - id: 261122-af90
    title: Remote Agents and Planning labels differ from the config
    why: "`metalbrain github labels sync --check` reports `differs Agents` and `differs Planning` at 75dc54fe; unknown whether the config or the remote is stale, and the check names no differing property."
    want: the remote labels match the config, with `labels sync --check` naming what differs.
