purpose: ESLint rules and conventions engrenage ships.
entries:
  - id: 261122-1b95
    title: Lint rules type their nodes by cast
    sites:
      - src/tools/eslint/conventions/stylistic/noReturnUndefined.ts:89
      - src/tools/eslint/conventions/stylistic/preferValuedReturn.ts:106
      - src/tools/eslint/conventions/structure/importEffects.ts:179
      - src/tools/eslint/conventions/imports/noExternalNamespace.ts:35
      - src/tools/eslint/operations/resolveConventionSections.ts:48
      - src/tools/eslint/types/ConventionSections.ts:3
      - src/tools/eslint/rules/apiInterface.ts:5
      - src/tools/eslint/conventions/docs/docTags.ts:293
      - src/tools/eslint/conventions/docs/documented.ts:175
      - src/tools/eslint/conventions/docs/documented.ts:274
      - src/tools/eslint/utils/findJsdocBlock.ts:10
      - src/tools/eslint/conventions/stylistic/noUselessReturn.ts:21
    why: "rules typed against core ESTree nodes (`defineRoleRule` takes `Rule.RuleContext`), so TS fields are probed with `in` or through `{ type: string }` guards; listeners widened to `Rule.Node`; doc rules mark ESTree typing at each TS node (`documented.ts` ×7); a report node lacks `parent`, so it is found again by location; ESTree-to-TS map cast `as TsNode`/`as never`; `context as unknown as ImportContext`; the sections record asserted; config key `sections` is a leftover name."
    want: typed typescript-eslint listeners; a typed record mapper; the key renamed.
  - id: 261122-0605
    title: ESLint rules check less than they should
    sites:
      - src/tools/eslint/conventions/imports/noPointlessDynamicImport.ts:17
      - src/tools/eslint/conventions/structure/importEffects.ts:195
      - src/tools/eslint/conventions/structure/importSpecifiers.ts:51
      - src/tools/eslint/conventions/structure/importSpecifiers.ts:63
      - src/tools/eslint/conventions/structure/roleExports.ts:35
      - src/tools/eslint/config/schemas/optionsSchema.ts:14
      - src/tools/eslint/conventions/structure/roleExports.ts:133
      - src/tools/eslint/conventions/docs/thrownErrors.ts:6
    why: dynamic-import rule sees direct imports only; bare side-effect imports take the highest binding level (#315); the specifier check lives outside `project/structure`, and an unknown path may postdate the index; `bin` has no lint scope; the schema accepts unknown convention names; imports of files the index knows as `unclassified` get no `unclassifiedPath` report (#707 covers unknown files only); a re-export without `type` counts as a value; thrown-error prose detection is heuristic.
    want: rule walks the static graph; specifier check in `project/structure`, index refreshed on unknown paths; `bin` checked; unknown names rejected; unclassified files reported.
  - id: 261122-8580
    title: ESLint plugin and analysis hold on unchecked inputs
    sites:
      - src/tools/eslint/utils/analyzeImports.ts:15
      - src/tools/eslint/utils/analyzeImports.ts:34
      - src/tools/eslint/utils/createPlugin.ts:29
      - src/tools/eslint/utils/defineBoundaryRule.ts:86
      - src/tools/eslint/conventions/stylistic/preferValuedReturn.ts:143
      - src/tools/eslint/conventions/comparisons/noInvertedComparisons.ts:53
      - src/tools/eslint/operations/loadEslintConfigs.ts:13
    why: "`analyzeImports` is keyed by the entity index alone; it forces the importer's extension on targets (`.json`, `.tsx` wrong); a disabled convention reading sections registers no rule; a boundary in another environment renders as `../src/…`; the fix hardcodes a two-space indent; the inverted-comparison fix leaves doubled parentheses; loaded configs are checked only as plain objects."
    want: inputs tied to one loaded config; target extensions from the target; disabled conventions reported; indent from the source.
  - id: 261122-d381
    title: "`readonly-constants` forces schemas to `StandardSchemaV1`, erasing output types"
    sites:
      - src/project/build/constants.ts:10
      - src/project/environments/constants.ts:75
      - src/project/environments/constants.ts:88
      - src/project/format/constants.ts:30
      - src/project/presets/constants.ts:15
      - src/project/roles/constants.ts:14
      - src/project/sync/constants.ts:11
      - src/project/sync/constants.ts:21
      - src/tools/metalbrain/constants.ts:17
      - src/workflows/gate/constants.ts:8
      - src/batiment/environments/constants.ts:7
    want: "a readonly-constants form keeping the schema's output type (planning: the rule is shared)."
  - id: 261122-aff5
    title: The naming rule splits words by hand
    sites:
      - src/tools/eslint/conventions/stylistic/naming.ts:22
    want: toolkit `splitWords`.
  - id: 261122-b35b
    title: "`projectService` spends ~5 s of a full lint matching files to tsconfigs"
    sites:
      - src/tools/eslint/utils/createTypeAwareLanguageOptions.ts:10
    why: TypeScript's `isMatchedByConfig` scans every solution reference's file names per opened file, quadratic in project size; per-environment `parserOptions.project` cut a full lint from 30.5 s to 23.9 s.
    want: per-environment `project` (against typescript-eslint's recommendation), or an upstream TypeScript fix (question).
  - id: 261122-08d4
    title: "`auaust/documented` reports aliases whose signature states their whole contract"
    why: "#541's pass answered with filler restating the alias (`Directories`, `Files`, `Globs`, `PackageNames`, eslint `Config`, `Plugin`, `RuleModule`, vscode `Setting`), which its Decisions forbid."
    want: the rule skips plain aliases of a list or an upstream type, or the convention names the comment they take.
  - id: 261122-efcc
    title: Rules mirror upstream rule internals
    sites:
      - src/tools/eslint/conventions/stylistic/noUnnecessaryTypeParameters.ts:51
      - src/tools/eslint/conventions/stylistic/noReturnUndefined.ts:26
    why: one copies the upstream usage count to look through `NoInfer`; the other mirrors `unicorn/no-useless-undefined`'s skipped return types, so an upstream change reopens a gap or a double report.
    done: upstream fixes, or a decision to keep the copies.
  - id: 261122-9d32
    title: An option-bearing rule stays out of `typescriptRules`
    sites:
      - src/tools/eslint/operations/createRecommendedRules.ts:44
    why: "`Rule` types options as mutable tuples, which the constants role rejects. Related: `261122-d381`."
    want: the constants role accepts readonly tuples, or rule options typed readonly.
  - id: 261122-f52a
    title: Tooling definer entries are memoized per process
    sites:
      - tooling/eslint/rules/definerEntries.ts:59
    why: "a long-lived ESLint, such as an editor server, keeps an entry's first reading after the config changes. Related: #57."
    want: memoized per lint run.
  - id: 261122-732e
    title: "`metalbrain debt` loads every ESLint plugin to run one rule"
    sites:
      - src/tools/eslint/operations/listDebtMarkers.ts:24
    why: "a cold run takes seconds. Related: #554."
    want: only the debt-marker rule loaded.
  - id: 261123-6d7b
    title: Extensions cannot attach lint rules to the role presets they contribute
    sites:
      - src/tools/eslint/config/schemas/optionsSchema.ts:50
    why: "#862 moved role rule loaders to defineEslintConfig's roleRules option, which only the user's ESLint config sets"
    want: an eslint.roleRules extension slot, shaped like eslint.conventions
  - id: 261124-a7ae
    title: "Type-aware recommended rules and other `files.*` references reach no workspace file: the project-only `files` key lists the root scope's published, private and discovered files only"
    sites:
      - src/tools/eslint/operations/createScopeRules.ts:142
    why: "Left by #764, which lints each scope from its child resolver; workspace files never had these rules, and #881 only removes Interscript stand-ins"
    want: "Each scope's published, private and discovered files resolved per scope, so its block's references cover its own files (a #675 consumer)"
  - id: 261124-803d
    title: "A lint convention contributed by an extension active in one workspace alone reaches no scope: convention categories load from the root config only"
    sites:
      - src/tools/eslint/operations/createEslintConfig.ts:51
    why: "#754 activates extensions per scope by when.preset; none of its contributions is a lint convention, so #881 needs no fix"
    want: Each scope's conventions loaded from its own child resolver's active extensions
  - id: 261124-31f9
    title: "Workspace files importing root #… aliases are reported as not in the structure map"
    sites:
      - src/project/structure/utils/createImportResolver.ts:59
    why: extensions/* import root aliases the root tsconfig paths resolve, but the resolver reads only the file's own scope aliases
    want: gate --all and a direct eslint run classify each import identically
  - id: 261124-cc2e
    title: The ESLint config repeats every convention per scope, so ESLint matches thousands of file patterns per file
    sites:
      - src/tools/eslint/operations/createScopeRules.ts:95
    why: Interscript's config has 574 objects and 8,476 file patterns; config-array's getConfig takes ~2.7 s CPU of the 19 s whole-project lint, minimatch 1.2 s of it
    want: fewer objects per scope, such as one merged object per scope and file kind, or basePath instead of prefixed patterns
