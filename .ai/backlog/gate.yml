purpose: The commit gate and its process locks.
entries:
  - id: 261122-b591
    title: Gate checks leave unchecked paths
    sites:
      - src/workflows/gate/operations/runGate.ts:244
      - src/workflows/gate/operations/runGate.ts:291
      - src/tools/prettier/extension.ts:72
      - src/tools/eslint/conventions/stylistic/noComplexConciseArrows.ts:151
      - src/tools/jscpd/extension.ts:28
    why: "staged mode reads the worktree, not the index; `eslint --fix` runs before `prettier --write`, so concise-arrow and line-budget checks miss Prettier's rewrites (adaff366 broke CI: `max-lines` 352/350 after Prettier wrapped a line); jscpd only warns; a stamped tree hides budget and step warnings; ESLint lints only changed files, so dependents' type-aware rules wait for `gate --all`. Dependents' type-aware lint: #284."
    want: each gap checked by the gate, or recorded as an accepted limit (planning).
  - id: 261122-cc0a
    title: Process locks and gate state leave stale or double holders
    sites:
      - src/foundation/processes/operations/withProcessLock.ts:83
      - src/foundation/processes/operations/withProcessLock.ts:116
      - src/foundation/processes/operations/withProcessLock.ts:179
      - src/workflows/gate/operations/runGate.ts:377
      - src/workflows/gate/operations/checkAgentStop.ts:33
    why: a waiter moving away a holder can leave two holders; a reused pid blocks waiters until timeout; a signal before the release listeners leaves the lock; a signal leaves the lock released while spawned tools write; the failing-tree marker hashes after the lock release.
    want: lock acquisition and release covering signals and pid reuse (planning).
  - id: 261122-c5fa
    title: "`GateWarning` repeats `GateFailure`'s shape"
    sites:
      - src/workflows/gate/types/GateWarning.ts:1
    want: one gate entry type carrying its severity.
  - id: 261122-69c1
    title: "`gate --worktree` in a shared checkout touches other sessions' work"
    why: "it fixes files other sessions changed, and its lint output interleaves runs from other worktrees (friction ×8; #615 › F25). #666 limits the stop gate to a session's files."
    want: "`gate --worktree` scoped like #666's stop gate; output kept per run."
  - id: 261122-f860
    title: The commit gate refuses the `snap` commit setting aside a leaf held for a failing gate
    why: "`walking.md` §Dispatching commits its rest on `worker/issue-<n>` or `debugger/issue-<n>`; bypasses are denied; stopping ends the autonomous walk."
    want: the gate exempting `snap` on `worker/*` and `debugger/*`; meanwhile, the skill leaving the rest uncommitted in a worktree on that branch, stashed there at K = 1.
    done: such a leaf reaches its branch without a gate bypass.
  - id: 261122-7188
    title: No check warns when a commit changes shipped files without a changeset
    why: reviewers miss the Environment table's changeset row; the `gatherer` fragments shipped unlisted.
    want: where changesets are used, commit and worktree gates warn on changes to a published package's `files` adding no `.changeset/*.md`.
    done: the warning exists; review checks keep only what it leaves manual.
  - id: 261122-67f6
    title: Gate test selection skips dependents and filters by substring
    sites:
      - src/tools/vitest/operations/runGateTests.ts:35
      - src/tools/vitest/operations/runGateTests.ts:74
    why: "a file with a mirrored domain runs only its mirror's tests, so tests through dependents run only in CI; mirror directories reach Vitest as substring filters kept apart by a trailing `/`, mixed with test files as plain strings. Related: #286."
    want: exact directory matches; dependents' tests selected.
  - id: 261122-c28e
    title: Message checks are listed in the gate
    sites:
      - src/workflows/gate/operations/runMessageGate.ts:81
    why: "gate steps are contributed by their domains; message checks are not. Related: #375."
    want: domains owning commit conventions contribute their message checks.
  - id: 261122-bfc2
    title: The worktree gate formats a moved generated file `.prettierignore` lists
    why: "in #768, the first `pnpm engrenage gate --worktree` reformatted the moved `src/batiment/environments/types/NamespaceInput.ts`, failing `codegen --check`; regenerating it, the second run passed."
    want: the gate honoring the ignore file for renamed paths.
