purpose: "Project configuration contract: loading, environments, option shapes and list options."
entries:
  - id: BL-c4dc2a
    title: Liquid and CSS are not languages engrenage knows.
    why: "#350 formats Liquid but keeps theme directories outside every environment. Model: environments are runtime contexts and never nest; languages are file kinds inside them."
    want: "a `liquid` environment mapping theme directories (#378, #390), and a CSS language domain (Stylelint or `@eslint/css`)."
    done: both exist, or obsolete once themes need neither.
    created: 2026-11-22T00:00:00Z
  - id: BL-3a5826
    title: CI and test timeouts are not configurable, nor per environment.
    why: "recent commit `fix: tests timeout in CI` changed a timeout; the value is fixed rather than a configuration option."
    want: the CI/test timeout is a configuration option, overridable per environment (see the environment model in `BL-c4dc2a`), with the current value as default.
    done: the timeout is set through the project configuration, per environment, and no generated config hardcodes it.
    created: 2026-11-22T00:00:00Z
  - id: BL-5748d2
    title: Host presets are missing for non-Shopify hosts.
    why: "a host project (Laravel) needs a preset keeping environment defaults out of host directories (#153 traits); Shopify's are #350."
    done: each adopting project has its preset, or the entry is obsolete.
    created: 2026-11-22T00:00:00Z
  - id: BL-38066b
    title: "`listDiscoveredGlobs` widens `files.discovered` with role-discovered globs, without a changeset."
    why: "#141 added it, so `files.discovered` now includes role globs (for this repository `tests/**/setup.ts`). No changeset was added; consumers may see new discovered files."
    want: check whether consumers are affected and add a changeset if so.
    created: 2026-11-22T00:00:00Z
  - id: BL-20f117
    title: Generic accessor factory sits in the options domain
    sites:
      - src/foundation/options/utils/createAccessors.ts:7
    why: used by `createTsconfig` and the package.json model.
    want: its own `foundation` home.
    created: 2026-11-22T00:00:00Z
  - id: BL-73c8d3
    title: Config loads do avoidable work and keep past results
    sites:
      - src/project/tsconfig/operations/createTsconfig.ts:2
      - src/project/config/operations/loadConfig.ts:20
      - src/project/config/operations/loadConfig.ts:110
      - src/project/config/operations/loadConfig.ts:121
    why: the static `typescript` import costs ~0.2 s per load; `loadConfig` keeps an entry per directory forever, and a read pending at `refresh` caches the stale config; `refresh` rides on `loadConfig` for want of a module-state role.
    want: lazy compiler import; bounded, refresh-safe caches in a module-state role (planning).
    created: 2026-11-22T00:00:00Z
  - id: BL-099e43
    title: Option sections and tsconfig paths are cast or unchecked
    sites:
      - src/foundation/options/config/declarers/declareSection.ts:7
      - src/foundation/options/ports/Section.ts:4
      - src/foundation/options/utils/createResolver.ts:225
      - src/foundation/options/utils/createAccessors.ts:40
      - src/project/tsconfig/utils/readTsconfigPaths.ts:19
    why: "`Config` comes from the annotation, unchecked against the resolver; the resolver context is `unknown`, narrowed bivariantly; sections get the open resolver, so key reads are untyped; compose cannot type getters from a dynamic map; hand-written paths are cast."
    want: section context typed through `Resolver<Context, Sections>`; paths validated against a schema.
    created: 2026-11-22T00:00:00Z
  - id: BL-c3460d
    title: Options infer meaning from shape or wording, and defaults live elsewhere
    sites:
      - src/foundation/options/utils/applyInputDefaults.ts:26
      - src/foundation/options/utils/applyInputDefaults.ts:62
      - src/foundation/options/utils/validate.ts:37
      - src/foundation/options/config/declarers/declareManagedList.ts:28
      - src/tools/git/config/schemas/gitSchema.ts:25
    why: a list adjustment is recognised by shape; creating a parent object skips an object option's computed default; valibot's default message detected by wording; some defaults are computed elsewhere and only documented.
    want: the declared option decides; no wording matches; defaults computed at the declaration.
    created: 2026-11-22T00:00:00Z
  - id: BL-c489b9
    title: Contributed environments are trusted past their checks
    sites:
      - src/project/config/config/schemas/extensionSchema.ts:92
      - src/project/structure/operations/readStructureOption.ts:11
    why: entries are typed as their slot's though only `load`, `enabled` or structure fields are checked.
    want: boundary validation for every field a contributed environment resolves.
    created: 2026-11-22T00:00:00Z
  - id: BL-ce9742
    title: Config codegen asserts what it could type
    sites:
      - scripts/codegen/operations/generateConfigTypes.ts:178
      - scripts/codegen/operations/generateConfigTypes.ts:349
      - scripts/codegen/operations/composeInputSchemas.ts:9
    why: every custom schema but one reads as `GlobalsFactory`; the draft 07 schema is asserted to the draft 04 type; `Section` erases its declaration type, so readers assert presence.
    want: each custom schema mapped to its type; `ConfigInput` type-checked against the sections (planning).
    created: 2026-11-22T00:00:00Z
  - id: BL-14d1f7
    title: Workflow builtins own no config key
    sites:
      - src/tools/eslint/extension.ts:8
      - src/tools/vite/extension.ts:4
      - src/tools/vitest/extension.ts:4
      - src/tools/tsdown/extension.ts:4
    why: "`eslint`, `vite`, `vitest`, `tsdown` options come only from definer arguments."
    want: a decision on which builtins own a key (planning).
    created: 2026-11-22T00:00:00Z
  - id: BL-ca1f85
    title: Sections and schemas state intent indirectly
    sites:
      - src/tools/git/config/sections/gitSection.ts:50
      - src/project/build/config/schemas/buildSchema.ts:55
    why: composing `gitSection` adds nothing over the plain object; `buildSchema` calls `resolveWithin` only for its throw, also in `cache()`.
    want: the object written directly; an explicit containment assertion.
    created: 2026-11-22T00:00:00Z
  - id: BL-f6f088
    title: Option declarers infer narrow types and resolve synchronously
    sites:
      - src/foundation/options/types/ObjectContext.ts:4
      - src/tools/github/config/schemas/githubSchema.ts:29
      - src/project/environments/config/sections/sourceOptionsSection.ts:21
    why: a declaration typed by the `DeclarationEntries` constraint infers `never`; `declare` infers a `{}` default as its type, emptying the record's members; `declareObject` resolves entries synchronously, so a section awaits its one async default.
    want: "`unknown` inferred at the declarer; defaults widened by the declarer; `declareObject` awaiting entries."
    created: 2026-11-22T00:00:00Z
  - id: BL-d57350
    title: State resources locate themselves outside the resolver
    sites:
      - src/project/config/extension.ts:33
      - src/tools/github/issues/planning/operations/locateGithubSnapshot.ts:4
    why: "`locate` cannot read `resources`, so each `state.<artefact>` recomputes its place from `stateDirectory`; the snapshot readers resolve `githubSnapshotFile` directly instead of `state.github`."
    want: the resolver locates a dotted resource inside its parent's directory, and every reader goes through it.
    created: 2026-11-22T00:00:00Z
  - id: BL-758327
    title: "`LoadedConfig.forget` reaches every holder, though only sync drops keys"
    sites:
      - src/project/config/types/LoadedConfig.ts:5
    done: "needs planning: which holders keep resolved keys and how they are told to drop them."
    created: 2026-11-22T00:00:00Z
  - id: BL-089d92
    title: Readonly lists in schemas stay mutable in their JSON Schema
    sites:
      - src/batiment/roles/config/schemas/reexportSchema.ts:5
    why: the JSON Schema codegen cannot convert `readonly()`, so the list lacks it and the types restate it as readonly.
    want: the codegen converts readonly lists.
    created: 2026-11-22T00:00:00Z
  - id: BL-182a63
    title: Config reads bypass the project that owns them
    sites:
      - src/project/config/operations/createDefiner.ts:30
      - src/project/config/operations/readRawConfig.ts:107
    why: an unbound definer, and Prettier's `package.json` reference, load the config of `process.cwd()`, not of the project owning the tool config file; `readRawConfig` repeats `tools/pnpm`'s workspace reading, which sits above it.
    want: definers bound to their config file's project; one `pnpm-workspace.yaml` reader in a shared lower domain.
    created: 2026-11-22T00:00:00Z
  - id: BL-9419ba
    title: Environment and preset contracts restate or leave meaning unstated
    sites:
      - src/project/environments/config/schemas/sourceSchema.ts:52
      - src/project/environments/types/ResolvedSource.ts:8
      - src/project/environments/ports/EnvironmentEntry.ts:15
      - src/project/presets/ports/PresetEntry.ts:13
    why: the source context restates the `BuildTool` port below `build`; the host union restates `sourceSchema`'s picklist; only `enforced` changes behaviour, so `foreign` versus `described` is unstated; preset entries take any slot though only `build.tools` reads them, typos ignored.
    want: the bundling capability in a lower shared domain; types inferred; each kind's effect stated; slots checked.
    created: 2026-11-22T00:00:00Z
  - id: BL-1cd010
    title: A config-input `environments` record replaces a preset's whole record instead of merging per entry
    sites:
      - src/foundation/options/utils/applyInputDefaults.ts:45
    why: "Registering one environment in the input drops every environment a preset registers (found in #846)"
    want: Record options merge per entry across layers, or the contract states replacement and presets register outside the record
    created: 2026-11-24T00:00:00Z
  - id: BL-40603c
    title: An input list adjustment marks a whole list option as set by the input, so a metafile overriding a default item reports a false `config-metafile-conflict`
    sites:
      - src/project/structure/adapters/createResolverContext.ts:69
      - src/foundation/options/utils/findValueOrigin.ts:7
    why: 'Input `src: { dirs: { append: ["app"] } }` makes a `src/.environment.json` replacing the default `src` placement an error (#846)'
    want: Origins per list item, or adjustments reported as their own layer
    created: 2026-11-24T00:00:00Z
  - id: BL-bf98f4
    title: project/config imports the built-in extensions list from workflows, a layer above it
    sites:
      - src/project/config/operations/createProjectConfig.ts:47
      - src/project/config/types/ConfigSections.ts:3
    why: "Dropped from #745 as no prerequisite: child resolvers reuse the root's registry"
    want: "Registry collection apart from resolver creation, so project/config imports no #workflows/* (#731 › Groundwork steps 1-3)"
    created: 2026-11-24T00:00:00Z
  - id: BL-9d892e
    title: A workspace registration placed on a directory an inherited registration re-places, such as src, raises environment-placement-conflict unless the workspace unplaces the inherited one
    sites:
      - src/batiment/environments/operations/discoverEnvironmentPlacements.ts:36
    why: Inherited and built-in placements re-place relative to each workspace (#886); presets unplace built-in names themselves (#887 for shopify-app), but no workspace config or preset can know the root's own registration names
    want: A scope's own registration replacing an inherited or default one on the same directory or file, or a decided reason to keep the conflict
    created: 2026-11-24T00:00:00Z
  - id: BL-c84fe4
    title: "A workspace's option diagnostics name the root option path: an unset syntax in a workspace glob's tests reports environments.tests.execution.syntax"
    sites:
      - src/project/environments/config/sections/executionSection.ts:93
    why: Interscript's theme glob warned as if the root tests environment lacked syntax, though the root sets none and needs none
    want: Diagnostics from a workspace scope name the option where that scope states it, such as workspaces.globs.theme.environments.tests or its .workspace.json
    created: 2026-11-24T00:00:00Z
  - id: BL-364f46
    title: Custom globals cannot be scoped to one environment
    why: "Interscript declares the shopify global for all of src and appends it by hand to admin and the extensions; the rest of environment composition is #959–#962"
    done: "Item in #966"
    created: 2026-11-26T10:59:20Z
