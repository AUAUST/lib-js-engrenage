purpose: "Breakage the #809 spec-leaf migration knowingly causes (S.18): what is expected to break and what must be handled before walks resume."
entries:
  - id: 261122-92d4
    title: Every existing plan holding Steps is refused at dispatch
    why: "the dispatch hook refuses any issue with **Steps** (P.3.3); 57 open issues hold them (engrenage 48, toolkit 2, interscript 7), under #675, #732, #338, #308 and 11 standalone."
    want: the P.3.2 sweep (planning skill › Steps migration) converts engrenage's, each batch reviewed by the user; the user migrates toolkit and interscript (S.23).
    done: no open engrenage issue holds **Steps**; then delete `steps-migration.md` with the consultant skill's §Steps sweep and the planner's and shaper's conversion mentions.
  - id: 261122-b731
    title: Leaves under a published segment without Done when are refused
    why: "`planning issue check` requires **Done when** on segments and checks ancestors (S.8), so every leaf under an older segment fails readiness."
    want: the P.3.2 sweep writes each open segment's **Done when** per the issue-drafts rule.
  - id: 261122-a2b9
    title: Housekeeping parents holding Tests are refused
    why: S.6 (46072c6d) forbids **Tests** on a Task or Problem whose own work is only **Housekeeping**; ancestors are checked, so their leaves fail readiness too. Unknown whether open issues hold both sections.
    want: query open issues holding both; move each **Tests** into the sub-issue owning it, with the P.3.2 sweep.
  - id: 261122-d7a3
    title: Consumers lack the consultant agent and reject `freshness`
    why: sync installs no new skill, so a consumer's walker and Steps sweep brief a `consultant` that does not exist; agent blocks still setting `freshness` fail schema validation.
    want: toolkit and interscript run `pnpm engrenage agents skills add consultant` and drop `freshness` when the user migrates them (S.23).
  - id: 261122-ec75
    title: "Sweeping #338 and #308 before #778 and #684 rewrites them twice"
    why: "#778 and #684 set who owns most of their remains (agent commands, init's agent steps, the issue-write hook); #382 and #765 also overlap on workspace entries in `createTsdownConfig`."
    want: "decide #778 and #684 before those sweeps."
  - id: 261122-30a3
    title: Rolling-wave planning changes how planned items reach their planners
    why: the planning skill dropped outer mode; § Waves routes each item (main-session.md). `outer`, `foundation` and `scaffold` no longer send every item to inner planners; items published with **Planning** for an inner pass now reach the walk's consultant, and only once every issue ordered before them lands, so walks run slower.
    want: the P.3.2 sweep states each kept item's **Planning** for the consultant, not an inner pass.
  - id: 261122-e401
    title: Published items name no owners
    why: readiness now requires each item's **Context** to name the owning domain and role (issue-drafts › Owners, S.29), so reviews move published items under **Planning**; a worker given a capability without owner stops with `Scope stop:` (S.30).
    want: the P.3.2 sweep names owners in each kept item's **Context**.
  - id: 261122-737b
    title: Thoroughness state written before per-contact windows fails the hook
    why: "`parseThoroughnessState` now requires `opened` and `scanned`; a subagent running across the update gets a hook error per tool call and loses its run record (seen at the 261122-c95f worker's own SubagentStop)."
    want: no subagent in flight when the change lands in a consumer; otherwise delete its `.ai/stats/<session>/*.thoroughness.json`.
