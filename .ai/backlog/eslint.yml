purpose: Upstream ESLint API limitations.
entries:
  - id: BL-21a8d8
    title: ESLint core rule modules are only reachable through a deprecated export.
    why: "`builtinRules` from `eslint/use-at-your-own-risk` is deprecated and `eslint/rules` only ships types, so no supported way loads a core rule module to delegate it or generate its types (`src/tools/eslint/utils/findUpstreamRule.ts`, `scripts/codegen/generateRuleTypes.ts`)."
    want: the supported accessor, once ESLint provides one.
    created: 2026-11-22T00:00:00Z
